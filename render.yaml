# Render Blueprint — FlagForge API
#
# Zero-card path: Render's free web service plan requires no payment method.
#
#   Dashboard → New + → Blueprint → pick this repo → Apply
#
# Render prompts for the four `sync: false` values (they are never stored here).
# Trade-off of the free plan: the service sleeps after ~15 minutes idle and the
# next request pays a cold start of roughly 30–60s. An open SSE connection keeps
# it awake while someone is using the app.
#
# `SESSION_SECRET` is generated by Render, so no secret lives in this file.
services:
  - type: web
    name: flagforge-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    # Match this to your Neon region where possible. Valid: oregon, ohio,
    # virginia, frankfurt, singapore.
    region: singapore
    branch: main
    autoDeploy: true
    # Readiness, not liveness: PostgreSQL is a hard dependency, so a machine that
    # cannot reach it must not be given traffic. A Redis outage still reports
    # `degraded` with HTTP 200 and stays in service.
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: CACHE_NAMESPACE
        value: flagforge-prod
      - key: L2_CACHE_TTL_SECONDS
        value: '300'
      - key: DEFAULT_ACTOR_EMAIL
        value: miteshlaptop999@gmail.com
      # Render generates a strong random value; it never appears in git.
      - key: SESSION_SECRET
        generateValue: true
      # Prompted for in the dashboard on first deploy:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Optional: leave unset to use the deterministic offline rule parser.
      - key: LLM_API_KEY
        sync: false
