name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Required by the Redis integration test (two API instances over Pub/Sub).
  REDIS_TEST_URL: redis://localhost:6379

jobs:
  # ── Static analysis + unit/integration tests ───────────────────────────────
  verify:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flagforge
          POSTGRES_PASSWORD: flagforge
          POSTGRES_DB: flagforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagforge -d flagforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgres://flagforge:flagforge@localhost:5432/flagforge
      DATABASE_TEST_URL: postgres://flagforge:flagforge@localhost:5432/flagforge
      REDIS_URL: redis://localhost:6379
      CACHE_NAMESPACE: flagforge-ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The journey test needs real tables, so migrate before running the suite.
      - name: Prepare test database
        run: |
          pnpm --filter @flagforge/evaluator build
          pnpm --filter @flagforge/api build
          node apps/api/dist/db/migrate.js

      - name: Typecheck + lint
        run: pnpm turbo run typecheck lint

      - name: Unit + integration tests
        run: pnpm turbo run test

  # ── Production build, then a real migrate → seed → HTTP smoke test ─────────
  build:
    name: Build · Migrate · Seed · Smoke
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flagforge
          POSTGRES_PASSWORD: flagforge
          POSTGRES_DB: flagforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagforge -d flagforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgres://flagforge:flagforge@localhost:5432/flagforge
      REDIS_URL: redis://localhost:6379
      CACHE_NAMESPACE: flagforge-ci
      API_HOST: 127.0.0.1
      API_PORT: 8080
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages and apps
        run: pnpm turbo run build

      - name: Apply migrations
        run: node apps/api/dist/db/migrate.js

      - name: Seed the demo project
        run: node apps/api/dist/db/seed.js

      - name: Boot the API and smoke-test both planes
        shell: bash
        run: |
          set -euo pipefail

          BASE=http://127.0.0.1:8080
          BODY_FILE=$(mktemp)

          # check <expected-status> <label> <curl args...>
          check() {
            local expected="$1"; shift
            local label="$1"; shift
            local code
            code=$(curl -s -o "$BODY_FILE" -w '%{http_code}' "$@")
            if [ "$code" != "$expected" ]; then
              echo "FAIL  $label — expected $expected, got $code"
              head -c 400 "$BODY_FILE"; echo
              exit 1
            fi
            echo "ok    $label ($code)"
          }

          node apps/api/dist/server.js &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          echo "Waiting for the API to become healthy..."
          healthy=0
          for i in $(seq 1 40); do
            if curl -sf "$BASE/health" > /dev/null; then
              echo "API healthy after ${i}s"; healthy=1; break
            fi
            sleep 1
          done
          if [ "$healthy" != "1" ]; then
            echo "FAIL  API never became healthy"
            exit 1
          fi

          echo "--- liveness and readiness ---"
          check 200 "GET /health" "$BASE/health"
          check 200 "GET /health/ready" "$BASE/health/ready"

          echo "--- the control plane requires a session ---"
          check 401 "GET /api/projects is rejected when anonymous" "$BASE/api/projects"
          check 200 "GET /api/sandbox stays public" "$BASE/api/sandbox"

          echo "--- authenticate as the seeded demo account ---"
          TOKEN=$(curl -sf -X POST "$BASE/api/auth/demo" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).token))")
          echo "    session token: ${#TOKEN} characters"
          AUTH="authorization: Bearer $TOKEN"

          check 200 "GET /api/auth/me" "$BASE/api/auth/me" -H "$AUTH"
          check 200 "GET /api/projects" "$BASE/api/projects" -H "$AUTH"
          check 401 "a forged token is rejected" "$BASE/api/projects" \
            -H 'authorization: Bearer forged.token'

          SANDBOX=$(curl -sf "$BASE/api/sandbox")
          ENV_ID=$(echo "$SANDBOX" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);const e=j.environments.find(x=>x.name==='prod')||j.environments[0];process.stdout.write(e.id)})")
          echo "    demo production environment: $ENV_ID"

          echo "--- SDK key rotation with a grace window ---"
          # Rotate BEFORE the outgoing key has ever been resolved in this process.
          # The service memoises key hashes, so exercising the old key first would
          # make the check below pass even with a broken grace window.
          ROTATED=$(curl -sf -X POST "$BASE/api/environments/$ENV_ID/rotate-key" \
            -H "$AUTH" -H 'content-type: application/json' -d '{"tier":"live"}')
          echo "$ROTATED" | head -c 220; echo
          NEW_KEY=$(echo "$ROTATED" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).sdkKey))")

          check 200 "the outgoing key still authenticates" \
            -X POST "$BASE/v1/evaluate" \
            -H 'content-type: application/json' \
            -H 'x-sdk-key: ff_live_demo_7f3a91c4e8b25d60' \
            -d '{"key":"new-checkout-flow","userId":"user_demo_001","attributes":{"plan":"enterprise"}}'

          check 200 "the new key authenticates" \
            -X POST "$BASE/v1/evaluate" \
            -H 'content-type: application/json' \
            -H "x-sdk-key: $NEW_KEY" \
            -d '{"key":"new-checkout-flow","userId":"user_demo_001","attributes":{"plan":"enterprise"}}'

          check 401 "an unknown SDK key is rejected" \
            -X POST "$BASE/v1/evaluate" \
            -H 'content-type: application/json' \
            -H 'x-sdk-key: ff_live_not_a_real_key' \
            -d '{"key":"new-checkout-flow","userId":"user_demo_001"}'

          echo "--- data plane ---"
          check 200 "batch evaluation" \
            -X POST "$BASE/v1/evaluate/batch" \
            -H 'content-type: application/json' \
            -H "x-sdk-key: $NEW_KEY" \
            -d '{"userId":"user_demo_002","attributes":{"plan":"pro","country":"US"}}'

          echo "    cache and timing headers:"
          curl -sfi -X POST "$BASE/v1/evaluate" \
            -H 'content-type: application/json' \
            -H 'x-sdk-key: ff_live_demo_7f3a91c4e8b25d60' \
            -d '{"key":"new-checkout-flow","userId":"user_demo_001","attributes":{"plan":"enterprise"}}' \
            | tr -d '\r' | grep -iE '^(HTTP/|x-cache-status|x-eval-time-ms)' | sed 's/^/      /'

          echo "--- observability ---"
          check 200 "GET /metrics" "$BASE/metrics"
          SERIES=$(curl -s "$BASE/metrics" | grep -c '^flagforge_' || true)
          echo "    flagforge metric series exported: $SERIES"
          if [ "$SERIES" -lt 1 ]; then
            echo "FAIL  no flagforge_* metrics were exported"
            exit 1
          fi

          echo "--- AI rule compiler ---"
          check 200 "GET /api/ai/status" "$BASE/api/ai/status" -H "$AUTH"
          check 200 "POST /api/ai/compile-rule" \
            -X POST "$BASE/api/ai/compile-rule" \
            -H "$AUTH" \
            -H 'content-type: application/json' \
            -d '{"prompt":"25% of Pro users in India on version 2.4.0 or higher","flagKey":"new-checkout-flow"}'

          echo "Smoke test passed."
