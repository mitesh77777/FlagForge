name: flagforge

services:
  # ── PostgreSQL — single source of truth for the control plane ───────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flagforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flagforge}
      POSTGRES_DB: ${POSTGRES_DB:-flagforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-flagforge} -d ${POSTGRES_DB:-flagforge}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ── Redis — L2 cache store + Pub/Sub invalidation bus ───────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── API — control plane (management) + data plane (evaluation) ──────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://flagforge:flagforge@postgres:5432/flagforge}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379}
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-flagforge}
      L2_CACHE_TTL_SECONDS: ${L2_CACHE_TTL_SECONDS:-300}
      # Empty = seed only if the demo project is absent; "force" = reset;
      # "false" = never.
      SEED_DEMO: ${SEED_DEMO:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-20000}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Web — admin dashboard + split-screen live sandbox (added in Phase 4) ────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      # NEXT_PUBLIC_* is inlined by Next.js at build time, so it must be a
      # build arg as well as a runtime value.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      API_INTERNAL_URL: ${API_INTERNAL_URL_DOCKER:-http://api:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
